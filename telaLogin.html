<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/x-icon" href="icons8-favicon-48.png" />
    <link href="styles_login.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="grid_container">
        <div class="grid_esquerda">
        </div>
        <div class="grid_direita">
            <div class="card">
                <a href="index.html" class="voltar">
                    <i class="fa-regular fa-hand-point-left fa-2x"></i>
                </a>
                <h1 style="font-style: italic;">Login</h1>
                <form action="paginaInicial.html">
                    <input type="email" class="form-control" placeholder="email" aria-label="email"
                        aria-describedby="addon-wrapping" required>
                    <br><br>
                    <input type="password" class="form-control" placeholder="senha" aria-label="senha"
                        aria-describedby="addon-wrapping" required>
                    <a href="">
                        <p>Esqueceu a sua senha?</p>
                    </a>
                    <br><br>
                        <button class="btn">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
